<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Thiệp mời 20/10 💐</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="card" id="inviteCard">
        <div class="card-inner">
            <!-- Mặt trước -->
            <div class="front">
                <img src="outside.jpg" alt="Thiệp ngoài" class="card-image">
                <div class="front-text">💌 Thiệp mời 20/10</div>
            </div>

            <!-- Mặt trong -->
            <div class="back">
                <div class="hearts">💖💖💖</div>
                <div class="message">
                    <h2>Chúc mừng ngày 20/10!</h2>
                    <p>Nhân ngày Phụ Nữ Việt Nam,<br>
                        mời bạn cùng tụi mình đi chơi & ăn uống vui vẻ nhé! 🎉<br><br>
                        📅 <b>Thời gian:</b> 20/10<br>
                        📍 <b>Địa điểm:</b> Sẽ bật mí khi gặp 😉</p>
                </div>
                <img src="inside.jpg" alt="Hình trong thiệp" class="inside-image">
                <div class="signature">— Người gửi: Một người đặc biệt 💐</div>
            </div>
        </div>
    </div>

    <audio id="bgMusic" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>
</body>

</html>
